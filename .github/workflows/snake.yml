# Cobrinha roxa comendo as contribuições (dist/ no branch "output"), atualizada todo dia.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 9 * * *"   # 06h de Maceió
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#4c1d95,#6d28d9,#8b5cf6,#c4b5fd
            dist/snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
